[project]
name = "prompt-engineering-learning"
version = "0.1.0"
description = "A progressive curriculum for prompt and AI system engineering"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0",
    "pydantic>=2.0",
    "Pillow>=10.0",
    "numpy>=1.20",
    "jupyterlab>=4.0",
    "nbclient>=0.10",
    "nbformat>=5.9",
    "ipywidgets>=8.0",
    "pytest>=8.0",
]

[project.optional-dependencies]
learner = []
contributor = [
    "nbclient>=0.10",
    "nbformat>=5.9",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = []
packages = ["northstar"]

[tool.setuptools.package-data]
northstar = ["fixtures/*.json", "fixtures/replays/*.json"]
